<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Sales Data Analysis</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 0; }
        p { font-size: 16px; line-height: 1.6; }
        .file-list { list-style: none; padding: 0; margin-top: 20px; }
        .file-item { background: #ecf0f1; margin: 10px 0; padding: 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .file-item:hover { background: #e2e7e9; }
        .file-name { font-weight: bold; color: #2c3e50; }
        .btn { background: #3498db; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 4px; font-size: 14px; transition: 0.2s; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h1>Enterprise Sales Data Analysis 📊</h1>
    <p>इस प्रोजेक्ट के अंतर्गत एंटरप्राइज सेल्स डेटा का विश्लेषण (Data Analysis) किया गया है। आप नीचे दी गई फाइलों को देख और डाउनलोड कर सकते हैं:</p>
    
    <ul class="file-list">
        <li class="file-item">
            <span class="file-name">📊 Excel Dashboard (Pivot Table)</span>
            <a href="enterprise_sales__PIVOTE TABLE.xlsx" class="btn" download>डाउनलोड करें</a>
        </li>
        <li class="file-item">
            <span class="file-name">🗄️ SQL Analysis Queries</span>
            <a href="enterprise_sale.sql" class="btn">देखें</a>
        </li>
        <li class="file-item">
            <span class="file-name">📄 Raw Data (CSV File)</span>
            <a href="enterprise_sales.csv" class="btn" download>डाउनलोड करें</a>
        </li>
    </ul>
</div>

</body>
</html>
